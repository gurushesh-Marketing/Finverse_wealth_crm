services:
  postgres:
    image: postgres:16-alpine
    container_name: fvc2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finverse_crm}
      POSTGRES_USER: ${POSTGRES_USER:-finverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fvc2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  fvc2-pgdata:
